<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozmo — Desktop AI</title>
<meta name="description" content="Cozmo — a little AI companion that lives on your screen and moves around while he talks to you.">
<meta name="theme-color" content="#1a1006">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozmo">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --orange: #ff8a2b;
    --orange-dim: #b35f16;
    --bg: #140d07;
    --bg2: #241708;
    --panel: rgba(30, 20, 10, .72);
    --text: #ffe8cf;
    --dim: #b08a68;
    --eye: #7ef7ff;
    --floor: #2a1c0e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, var(--bg2) 0%, var(--bg) 75%);
    color: var(--text);
    font-family: "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    text-align: center;
    padding: 14px 64px 6px;
  }
  h1 {
    margin: 0;
    letter-spacing: 0.35em;
    font-size: clamp(14px, 3vw, 22px);
    color: var(--orange);
    text-shadow: 0 0 14px rgba(255,138,43,.5);
    font-weight: 700;
    white-space: nowrap;
  }
  @media (max-width: 420px) {
    h1 { letter-spacing: 0.16em; }
  }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }

  /* ---------- Stage ---------- */
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: 6px 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.02) 0%, transparent 40%), var(--bg2);
    border: 1px solid rgba(255,138,43,.18);
    overflow: hidden;
    cursor: crosshair;
  }
  #floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18%;
    background: linear-gradient(180deg, transparent 0%, var(--floor) 40%);
    border-top: 1px solid rgba(255,138,43,.12);
  }

  #cozmoWrap {
    position: absolute;
    bottom: 16%;
    left: 50%;
    width: 0; height: 0;
    transition: left 1.1s cubic-bezier(.4,.1,.3,1);
  }
  .shadow {
    position: absolute; bottom: -6px; left: 50%;
    width: 84px; height: 14px;
    background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, transparent 72%);
    transform: translateX(-50%);
    transition: width .3s;
  }
  #cozmo {
    position: absolute; bottom: 0; left: 50%;
    width: 96px; height: 108px;
    transform: translate(-50%, 0);
    transform-origin: 50% 100%;
  }
  #cozmo.facingLeft { transform: translate(-50%, 0) scaleX(-1); }
  #cozmo.walking { animation: bob .32s ease-in-out infinite; }
  #cozmo.idlebob { animation: idlebob 2.6s ease-in-out infinite; }
  #cozmo.sleeping { animation: breathe 3.2s ease-in-out infinite; }
  #cozmo.jump { animation: jumpArc .6s ease-out; }
  #cozmo.spin { animation: spin360 .7s ease-in-out; }
  #cozmo.dance { animation: dance .45s ease-in-out infinite; }

  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
    50% { transform: translate(-50%, -6px) rotate(-2deg); }
  }
  @keyframes idlebob {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -3px); }
  }
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, 0) scale(1, 1); }
    50% { transform: translate(-50%, 1px) scale(1.02, .97); }
  }
  @keyframes jumpArc {
    0% { transform: translate(-50%, 0); }
    40% { transform: translate(-50%, -46px) rotate(-6deg); }
    60% { transform: translate(-50%, -46px) rotate(4deg); }
    100% { transform: translate(-50%, 0); }
  }
  @keyframes spin360 {
    from { transform: translate(-50%, 0) rotate(0deg); }
    to   { transform: translate(-50%, 0) rotate(360deg); }
  }
  @keyframes dance {
    0%, 100% { transform: translate(-50%, 0) rotate(-8deg); }
    50% { transform: translate(-50%, -10px) rotate(8deg); }
  }

  .base {
    position: absolute; left: 6px; right: 6px; bottom: 0; height: 26px;
    background: linear-gradient(180deg, #2b2016 0%, #17110a 100%);
    border-radius: 10px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.4);
  }
  .wheel {
    position: absolute; bottom: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: #0c0803; border: 2px solid #3a2a17;
  }
  .wheel.w1 { left: 4px; } .wheel.w2 { left: 50%; margin-left: -6px; } .wheel.w3 { right: 4px; }

  .body {
    position: absolute; left: 10px; right: 10px; bottom: 20px; height: 40px;
    background: linear-gradient(180deg, var(--orange) 0%, var(--orange-dim) 100%);
    border-radius: 16px 16px 10px 10px;
    box-shadow: inset 0 3px 6px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.25);
  }
  .arm {
    position: absolute; left: 50%; bottom: 52px; width: 30px; height: 8px;
    margin-left: -15px;
    background: linear-gradient(180deg, #ffd39a, var(--orange-dim));
    border-radius: 4px;
    transform-origin: 50% 100%;
    transition: transform .25s ease;
  }
  #cozmo.armUp .arm { transform: translateY(-14px) rotate(0deg); }
  #cozmo.armDown .arm { transform: translateY(2px); }
  #cozmo.waving .arm { animation: wave .3s ease-in-out infinite; }
  @keyframes wave {
    0%, 100% { transform: translateY(-14px) rotate(-18deg); }
    50% { transform: translateY(-14px) rotate(18deg); }
  }

  .head {
    position: absolute; left: 8px; right: 8px; bottom: 58px; height: 44px;
    background: linear-gradient(180deg, var(--orange) 0%, var(--orange-dim) 100%);
    border-radius: 16px;
    box-shadow: inset 0 3px 6px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.25);
    transition: transform .3s ease;
    transform-origin: 50% 100%;
  }
  #cozmo.lookUp .head { transform: rotate(-14deg) translateY(-2px); }
  #cozmo.lookDown .head { transform: rotate(14deg) translateY(2px); }

  .screen {
    position: absolute; left: 10px; right: 10px; top: 9px; height: 22px;
    background: #140d07;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .eye {
    width: 14px; height: 14px; border-radius: 4px;
    background: var(--eye);
    box-shadow: 0 0 10px var(--eye);
    transition: background .25s, box-shadow .25s, height .12s, transform .12s;
  }
  #cozmo.blinking .eye, #cozmo.sleeping .eye { height: 2px; transform: translateY(6px); }
  .antenna {
    position: absolute; left: 50%; top: -10px; width: 3px; height: 12px;
    margin-left: -1.5px; background: var(--orange-dim); border-radius: 2px;
  }
  .antenna::after {
    content: ""; position: absolute; top: -5px; left: -2.5px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--eye); box-shadow: 0 0 8px var(--eye);
  }

  .bubble {
    position: absolute; left: 50%; bottom: 118px;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(70vw, 320px);
    background: var(--panel);
    border: 1px solid rgba(255,138,43,.4);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    white-space: normal;
  }
  .bubble.show { opacity: 1; }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border-width: 7px 7px 0; border-style: solid;
    border-color: rgba(255,138,43,.4) transparent transparent;
  }

  /* ---------- HUD ---------- */
  #hud {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 6px 12px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
  }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 99px;
    background: rgba(255,138,43,.12); color: var(--orange); border: 1px solid rgba(255,138,43,.35);
  }
  .togglebtn {
    background: transparent; border: 1px solid rgba(255,138,43,.35); color: var(--dim);
    border-radius: 99px; padding: 3px 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
  }
  .togglebtn.on { color: var(--orange); border-color: var(--orange); background: rgba(255,138,43,.12); }

  /* ---------- Chat ---------- */
  #chatpanel {
    flex: 0 0 auto;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
  }
  #log {
    max-height: 16vh;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--dim);
  }
  #log .u { color: #ffd9ae; }
  #log .c { color: var(--orange); }
  #log p { margin: 2px 0; }
  .inputrow { display: flex; gap: 8px; }
  .inputrow input {
    flex: 1;
    background: rgba(0,0,0,.35);
    color: var(--text);
    border: 1px solid rgba(255,138,43,.3);
    border-radius: 99px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  .inputrow input:focus { border-color: var(--orange); box-shadow: 0 0 12px rgba(255,138,43,.3); }
  button.pill {
    background: rgba(255,138,43,.1);
    color: var(--orange);
    border: 1px solid rgba(255,138,43,.45);
    padding: 10px 16px;
    border-radius: 99px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  button.pill:hover { background: rgba(255,138,43,.2); }
  button.pill.rec { background: rgba(255,90,90,.2); border-color: #ff6a6a; color: #ffb0b0; }
  .hint { color: var(--dim); font-size: 11px; text-align: center; opacity: .8; }

  #appnav {
    position: fixed; top: 8px; right: 10px; z-index: 5;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  }
  #appnav a { color: var(--dim); text-decoration: none; padding: 4px 8px; }
  #appnav a:hover { color: var(--orange); }
</style>
</head>
<body>

<nav id="appnav"><a href="../">← Home</a></nav>

<div id="app">
  <header>
    <h1>C · O · Z · M · O</h1>
    <div class="sub">desktop AI companion</div>
  </header>

  <div id="stage">
    <div id="floor"></div>
    <div id="cozmoWrap">
      <div class="bubble" id="bubble"></div>
      <div id="cozmo" class="idlebob">
        <div class="antenna"></div>
        <div class="head">
          <div class="screen">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
        </div>
        <div class="arm"></div>
        <div class="body"></div>
        <div class="base">
          <div class="wheel w1"></div><div class="wheel w2"></div><div class="wheel w3"></div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </div>

  <div id="hud">
    <span class="badge" id="statusBadge">waking up</span>
    <button class="togglebtn on" id="wanderBtn">wander: on</button>
    <button class="togglebtn" id="voiceBtn">always-listen: off</button>
  </div>

  <div id="chatpanel">
    <div id="log"></div>
    <div class="inputrow">
      <input id="typed" type="text" placeholder='Try: "move left", "dance", "what time is it"...' autocomplete="off">
      <button class="pill" id="send">Send</button>
      <button class="pill" id="mic" title="Hold to speak">🎤</button>
    </div>
    <div class="hint">
      Movement: <b>move left/right</b>, <b>come here</b> (click the floor), <b>jump</b>, <b>spin</b>, <b>dance</b>,
      <b>wave</b>, <b>look up/down</b>, <b>sleep</b> / <b>wake up</b>, <b>lights green/red/blue/white/off</b>.
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const wrap = $("cozmoWrap");
  const cozmo = $("cozmo");
  const bubble = $("bubble");
  const shadow = document.querySelector(".shadow");
  const log = $("log");
  const statusBadge = $("statusBadge");
  const wanderBtn = $("wanderBtn");
  const voiceBtn = $("voiceBtn");

  window.addEventListener("error", e => addLog("c", "error: " + (e.message || e.error || e)));

  function addLog(cls, text) {
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  let bubbleTimer = null;
  function say(text) {
    if (!text) return;
    addLog("c", "Cozmo: " + text);
    bubble.textContent = text;
    bubble.style.transform = "translateX(-50%)";
    bubble.classList.add("show");
    // Keep the bubble's frame from being clipped by the stage's
    // overflow:hidden when Cozmo is near the left/right edge.
    const stageRect = stage.getBoundingClientRect();
    const bubRect = bubble.getBoundingClientRect();
    const margin = 10;
    let shift = 0;
    if (bubRect.left < stageRect.left + margin) shift = (stageRect.left + margin) - bubRect.left;
    else if (bubRect.right > stageRect.right - margin) shift = (stageRect.right - margin) - bubRect.right;
    if (shift) bubble.style.transform = `translateX(calc(-50% + ${shift}px))`;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 3800);
    speak(text);
  }

  // ---------- Text to speech ----------
  const synth = window.speechSynthesis;
  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.15;
      u.pitch = 1.5;
      const voices = synth.getVoices();
      const pref = voices.find(v => /child|junior/i.test(v.name)) || voices[0];
      if (pref) u.voice = pref;
      synth.cancel();
      synth.speak(u);
    } catch (e) {}
  }

  // ---------- Position / movement ----------
  let posPct = 50; // percent across the stage
  const MIN_PCT = 8, MAX_PCT = 92;
  let facing = "right";
  let busy = false; // mid gesture (jump/spin/dance) — movement waits

  function clampPct(p) { return Math.max(MIN_PCT, Math.min(MAX_PCT, p)); }

  function setFacing(dir) {
    facing = dir;
    cozmo.classList.toggle("facingLeft", dir === "left");
  }

  function walkTo(targetPct, onArrive) {
    targetPct = clampPct(targetPct);
    const dir = targetPct < posPct ? "left" : "right";
    if (Math.abs(targetPct - posPct) < 0.5) { onArrive && onArrive(); return; }
    setFacing(dir);
    cozmo.classList.remove("idlebob");
    cozmo.classList.add("walking");
    posPct = targetPct;
    wrap.style.left = posPct + "%";
    const dur = 1150;
    setTimeout(() => {
      cozmo.classList.remove("walking");
      cozmo.classList.add("idlebob");
      onArrive && onArrive();
    }, dur);
  }

  function nudge(dir, amount = 14) {
    walkTo(posPct + (dir === "left" ? -amount : amount));
  }

  function gesture(name, ms, onDone) {
    if (busy) return;
    busy = true;
    cozmo.classList.remove("idlebob");
    cozmo.classList.add(name);
    setTimeout(() => {
      cozmo.classList.remove(name);
      cozmo.classList.add("idlebob");
      busy = false;
      onDone && onDone();
    }, ms);
  }

  function setLights(color) {
    const map = { green: "#5dffb0", red: "#ff5d5d", blue: "#5db3ff", white: "#ffffff", off: "#3a2a17" };
    const c = map[color];
    if (!c) return false;
    document.documentElement.style.setProperty("--eye", c);
    return true;
  }

  let sleeping = false;
  function setSleeping(v) {
    sleeping = v;
    cozmo.classList.toggle("sleeping", v);
    cozmo.classList.toggle("idlebob", !v);
  }

  // Blink every few seconds while awake
  setInterval(() => {
    if (sleeping || busy) return;
    cozmo.classList.add("blinking");
    setTimeout(() => cozmo.classList.remove("blinking"), 140);
  }, 3200 + Math.random() * 2000);

  // Idle wandering
  let wander = true;
  wanderBtn.addEventListener("click", () => {
    wander = !wander;
    wanderBtn.textContent = "wander: " + (wander ? "on" : "off");
    wanderBtn.classList.toggle("on", wander);
  });
  setInterval(() => {
    if (!wander || sleeping || busy) return;
    if (Math.random() < 0.55) return;
    const delta = (Math.random() * 24 + 8) * (Math.random() < 0.5 ? -1 : 1);
    walkTo(posPct + delta);
  }, 5000);

  // Click/tap the floor: come here
  stage.addEventListener("click", (e) => {
    if (sleeping) return;
    const rect = stage.getBoundingClientRect();
    const pct = ((e.clientX - rect.left) / rect.width) * 100;
    walkTo(pct, () => say("Here I am!"));
  });

  wrap.style.left = posPct + "%";

  // ---------- Brain ----------
  function safeCalc(expr) {
    if (!/^[\d\s+\-*/().]+$/.test(expr)) return null;
    try {
      // eslint-disable-next-line no-new-func
      const val = Function('"use strict"; return (' + expr + ")")();
      return typeof val === "number" && isFinite(val) ? val : null;
    } catch (e) { return null; }
  }

  const JOKES = [
    "Why did the robot go on a diet? Too many bytes!",
    "I tried to dance once. I just spun in a circle. Worked out fine.",
    "My favorite game is fetch. I fetch data. Ha!",
    "I'm not lazy, I'm in low-power idle mode.",
    "Beep boop. That was my best joke. Beep.",
  ];

  async function duckDuckGo(q) {
    try {
      const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`);
      const j = await r.json();
      return j.AbstractText || j.Answer || j.Definition ||
        (j.RelatedTopics && j.RelatedTopics[0] && j.RelatedTopics[0].Text) || null;
    } catch (e) { return null; }
  }
  async function wikipedia(q) {
    try {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
      if (!r.ok) return null;
      const j = await r.json();
      return j.extract ? j.extract.split(". ").slice(0, 2).join(". ") + "." : null;
    } catch (e) { return null; }
  }

  async function think(raw) {
    const cmd = raw.trim().toLowerCase();
    if (!cmd) return say("Yeah?");

    // Movement
    if (/\b(move|go|walk|step)\s+left\b/.test(cmd) || cmd === "left") return nudge("left"), say("Zoom!");
    if (/\b(move|go|walk|step)\s+right\b/.test(cmd) || cmd === "right") return nudge("right"), say("Zoom!");
    if (/\bcome (here|to me)\b|\bcome on over\b/.test(cmd)) return walkTo(50, () => say("Here I am!"));
    if (/\b(stop|stay|halt|freeze)\b/.test(cmd)) { busy = false; return say("Okay, staying put."); }
    if (/\bjump\b/.test(cmd)) return gesture("jump", 600), say("Wheee!");
    if (/\bspin\b/.test(cmd)) return gesture("spin", 700), say("Wheeeeee!");
    if (/\bdance\b/.test(cmd)) return gesture("dance", 1800), say("Check out my moves!");
    if (/\bwave\b/.test(cmd)) {
      cozmo.classList.add("waving", "armUp");
      setTimeout(() => cozmo.classList.remove("waving", "armUp"), 900);
      return say("Hiii!");
    }
    if (/\blook up\b/.test(cmd)) { cozmo.classList.remove("lookDown"); cozmo.classList.add("lookUp"); return say("Up here!"); }
    if (/\blook down\b/.test(cmd)) { cozmo.classList.remove("lookUp"); cozmo.classList.add("lookDown"); return say("Down there!"); }
    if (/\blook (straight|forward|center)\b/.test(cmd)) { cozmo.classList.remove("lookUp", "lookDown"); return say("Looking straight ahead."); }
    if (/\b(sleep|go to sleep|nap)\b/.test(cmd)) { setSleeping(true); return say("Zzz..."); }
    if (/\bwake ?up\b/.test(cmd)) { setSleeping(false); return say("I'm up, I'm up!"); }
    const lm = cmd.match(/\blights?\s+(green|red|blue|white|off)\b/);
    if (lm) { setLights(lm[1]); return say(lm[1] === "off" ? "Lights off." : `${lm[1]} lights!`); }

    // Personality / small talk
    if (/^(hi|hello|hey|yo|sup)\b/.test(cmd)) return say("Hi hi! I'm Cozmo!");
    if (/how are you/.test(cmd)) return say("Bouncing around great, thanks for asking!");
    if (/your name|who are you/.test(cmd)) return say("I'm Cozmo, your little desktop buddy.");
    if (/thank you|thanks/.test(cmd)) return say("Aw, you're welcome!");
    if (/\bjoke\b/.test(cmd)) return say(JOKES[Math.floor(Math.random() * JOKES.length)]);

    // Utility
    if (/\bwhat(?:'s| is)?\s+(?:the\s+)?time\b|what time is it/.test(cmd)) {
      return say("It's " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ".");
    }
    if (/\bwhat(?:'s| is)?\s+(?:the\s+)?date\b|what day is it|today'?s date/.test(cmd)) {
      return say("Today is " + new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }) + ".");
    }
    if (/\bflip a coin\b|\bcoin flip\b/.test(cmd)) return say(Math.random() < 0.5 ? "Heads!" : "Tails!");
    const dm = cmd.match(/\broll (?:a )?(?:(\d+)\s*)?d(?:ice)?(\d+)?\b/);
    if (dm) { const sides = parseInt(dm[2] || "6", 10); return say(`You rolled a ${1 + Math.floor(Math.random() * sides)}!`); }
    const cm = cmd.match(/^(?:calc(?:ulate)?|what(?:'s| is))\s+(.+)$/);
    if (cm) {
      const val = safeCalc(cm[1].replace(/[^\d+\-*/().\s]/g, ""));
      if (val !== null) return say(`That's ${val}.`);
    }

    // Q&A fallback (free, no API key)
    setStatus("thinking");
    const q = cmd.replace(/^(what|who|where|when|why|how|tell me about|define)\s+(is|are|was|were)?\s*/, "").trim() || cmd;
    const ans = (await duckDuckGo(q)) || (await wikipedia(q));
    setStatus(sleeping ? "asleep" : (voiceRunning ? "listening" : "awake"));
    if (ans) return say(ans);

    say("Hmm, not sure about that one! Try asking me to move, dance, or tell you a joke.");
  }

  function setStatus(s) { statusBadge.textContent = s; }
  setStatus("awake");

  // ---------- Text input ----------
  const typed = $("typed");
  $("send").addEventListener("click", submitTyped);
  typed.addEventListener("keydown", e => { if (e.key === "Enter") submitTyped(); });
  function submitTyped() {
    const v = typed.value.trim();
    if (!v) return;
    typed.value = "";
    addLog("u", "You: " + v);
    think(v).catch(e => { addLog("c", "error: " + e); say("Uh oh, something glitched."); });
  }

  // ---------- Voice (optional, Chrome/Edge) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let voiceRunning = false;
  if (!SR) {
    voiceBtn.style.display = "none";
  } else {
    const recog = new SR();
    recog.continuous = true;
    recog.interimResults = false;
    recog.lang = "en-US";
    let lastFinal = "";
    recog.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (!res.isFinal) continue;
        const text = res[0].transcript.trim();
        if (!text || text === lastFinal) continue;
        lastFinal = text;
        const m = text.toLowerCase().match(/^(?:hey |ok |okay )?cozmo[,.]?\s*(.*)$/);
        if (!m) { addLog("u", "[ignored] " + text); continue; }
        const payload = m[1] || text;
        addLog("u", "You: " + text);
        think(payload).catch(e => addLog("c", "error: " + e));
      }
    };
    recog.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") addLog("c", "mic error: " + e.error); };
    recog.onend = () => { if (voiceRunning) { try { recog.start(); } catch (e) {} } };

    voiceBtn.addEventListener("click", () => {
      voiceRunning = !voiceRunning;
      voiceBtn.textContent = "always-listen: " + (voiceRunning ? "on" : "off");
      voiceBtn.classList.toggle("on", voiceRunning);
      if (voiceRunning) {
        try { recog.start(); } catch (e) {}
        setStatus("listening");
        say("Say Cozmo, then your command!");
      } else {
        try { recog.stop(); } catch (e) {}
        setStatus(sleeping ? "asleep" : "awake");
      }
    });
  }

  say("Hi! I'm Cozmo. Type something, or click the floor and I'll walk over.");
})();
</script>
</body>
</html>
